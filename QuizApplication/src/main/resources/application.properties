# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tej123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties - Let Hibernate create tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable SQL script initialization - use Hibernate instead
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.context.annotation=DEBUG

spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/

server.port=${PORT:8080}
